<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Optimization Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">Voucher Optimization Calculator</h1>
        
        <div class="mb-4">
            <label for="voucherView" class="block text-sm font-semibold text-gray-700 mb-1">Voucher Value ($)</label>
            <input type="number" id="voucherView" value="1000" min="1" class="w-full p-3 border border-gray-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 1000">
        </div>

        <div class="mb-4">
            <label for="itemsView" class="block text-sm font-semibold text-gray-700 mb-1">Item Prices (Comma or space separated)</label>
            <textarea id="itemsView" rows="4" class="w-full p-3 border border-gray-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 250, 480, 120, 600"></textarea>
        </div>

        <button onclick="calculateOptimal()" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-200 text-lg shadow-md mb-6 cursor-pointer">
            Calculate Optimal Combination
        </button>

        <div id="resultView" class="hidden border-t pt-4">
            <h2 class="text-lg font-bold text-gray-800 mb-3">Calculation Result</h2>
            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600">Total Price:</span>
                    <span id="resTotal" class="font-bold text-xl text-indigo-700">$0</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600 font-bold">Unusable Amount:</span>
                    <span id="resDiff" class="font-bold text-lg text-gray-800">$0</span>
                </div>
                
                <div class="border-t pt-2 mt-2">
                    <span class="block text-sm font-semibold text-gray-700 mb-1">Items to Purchase:</span>
                    <ul id="resList" class="list-disc list-inside text-gray-600 space-y-1"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedVoucher = localStorage.getItem('voucherAmount');
            const savedItems = localStorage.getItem('itemPrices');

            if (savedVoucher) document.getElementById('voucherView').value = savedVoucher;
            if (savedItems) document.getElementById('itemsView').value = savedItems;
            
            if (savedVoucher || savedItems) {
                calculateOptimal();
            }
        });

        function saveToStorage(voucher, items) {
            localStorage.setItem('voucherAmount', voucher);
            localStorage.setItem('itemPrices', items);
        }

        function calculateOptimal() {
            const voucherInput = document.getElementById('voucherView').value;
            const itemsInput = document.getElementById('itemsView').value;
            
            saveToStorage(voucherInput, itemsInput);

            const voucherAmount = parseInt(voucherInput) || 0;
            if (voucherAmount <= 0) {
                alert('Please enter a valid voucher amount.');
                return;
            }

            // Parse prices and filter out items that are inherently more expensive than the voucher
            const prices = itemsInput.split(/[\s,]+/)
                                    .map(p => parseInt(p.trim()))
                                    .filter(p => !isNaN(p) && p > 0 && p <= voucherAmount);

            if (prices.length === 0) {
                alert('No valid item prices found within the voucher limit.');
                return;
            }

            // Dynamic Programming for Knapsack Problem
            const W = voucherAmount;
            const n = prices.length;
            const dp = Array.from({ length: n + 1 }, () => Array(W + 1).fill(0));

            for (let i = 0; i < n; i++) {
                const price = prices[i];
                for (let w = 0; w <= W; w++) {
                    if (w >= price) {
                        dp[i + 1][w] = Math.max(dp[i][w], dp[i][w - price] + price);
                    } else {
                        dp[i + 1][w] = dp[i][w];
                    }
                }
            }

            // Backtracking to find the exact combination
            const optimalCombo = [];
            let currW = W;
            for (let i = n - 1; i >= 0; i--) {
                const price = prices[i];
                if (currW >= price && dp[i + 1][currW] === dp[i][currW - price] + price) {
                    optimalCombo.unshift(price); // Inserts at the beginning, avoiding reverse() later
                    currW -= price;
                }
            }

            const totalAmount = dp[n][W];
            const diff = voucherAmount - totalAmount;

            // Update UI
            document.getElementById('resTotal').innerText = `$${totalAmount}`;
            
            const resDiff = document.getElementById('resDiff');
            if (diff === 0) {
                resDiff.innerText = `Exact Match! ($0 wasted)`;
                resDiff.className = "font-bold text-lg text-green-600";
            } else {
                resDiff.innerText = `$${diff} wasted`;
                resDiff.className = "font-bold text-lg text-red-500";
            }

            const resList = document.getElementById('resList');
            resList.innerHTML = optimalCombo.map(price => `<li>Item: $${price}</li>`).join('');

            document.getElementById('resultView').classList.remove('hidden');
        }
    </script>
</body>
</html>
