<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品券最適化電卓</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4 min-h-screen flex items-center justify-center">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">🎫 商品券・最適化電卓</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">商品券の額面 (円)</label>
            <input type="number" id="voucherView" value="1000" class="w-full p-3 border border-gray-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例: 1000">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">商品の価格 (カンマ区切り、または1行ずつ)</label>
            <textarea id="itemsView" rows="4" class="w-full p-3 border border-gray-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例: 250, 480, 120, 600"></textarea>
        </div>

        <button onclick="calculateOptimal()" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-200 text-lg shadow-md mb-6">
            最適な組み合わせを計算
        </button>

        <div id="resultView" class="hidden border-t pt-4">
            <h2 class="text-lg font-bold text-gray-800 mb-3">💡 計算結果</h2>
            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600">選択された商品の合計:</span>
                    <span id="resTotal" class="font-bold text-xl text-indigo-700">0 円</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600 font-bold">商品券との差額:</span>
                    <span id="resDiff" class="font-bold text-lg text-gray-800">0 円</span>
                </div>
                <div class="text-xs text-gray-500 mb-3">※マイナスの場合は自腹での手出し金額、プラスの場合はお釣りが出ず損する金額</div>
                
                <div class="border-t pt-2 mt-2">
                    <span class="block text-sm font-semibold text-gray-700 mb-1">カゴに入れる商品一覧:</span>
                    <ul id="resList" class="list-disc list-inside text-gray-600 space-y-1">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateOptimal() {
            const voucherAmount = parseInt(document.getElementById('voucherView').value) || 0;
            const itemsInput = document.getElementById('itemsView').value;
            
            // カンマ、スペース、改行で区切って数値を抽出
            const prices = itemsInput.split(/[\s,、\n]+/)
                                    .map(p => parseInt(p.trim()))
                                    .filter(p => !isNaN(p) && p > 0);

            if (prices.length === 0 || voucherAmount === 0) {
                alert('商品券の額面と商品の価格を正しく入力してください。');
                return;
            }

            // 動的計画法（DP）で、商品券の金額「以下」で最大の合計となる組み合わせを見つける
            // ※もし「商品券を超えてもいいから一番近い額」にしたい場合は上限を増やすが、今回は「お釣りが出ない損を避ける」ため「額面以下での最大」を狙うロジックにしています。
            
            const W = voucherAmount;
            const n = prices.length;
            
            // dp[i][w] = i番目までの商品を使って、合計金額w以下で作れる最大金額
            const dp = Array.from({ length: n + 1 }, () => Array(W + 1).fill(0));

            for (let i = 0; i < n; i++) {
                for (let w = 0; w <= W; w++) {
                    if (w >= prices[i]) {
                        dp[i + 1][w] = Math.max(dp[i][w], dp[i][w - prices[i]] + prices[i]);
                    } else {
                        dp[i + 1][w] = dp[i][w];
                    }
                }
            }

            // 最適な組み合わせの復元
            const optimalCombo = [];
            let currW = W;
            for (let i = n - 1; i >= 0; i--) {
                if (currW >= prices[i] && dp[i + 1][currW] === dp[i][currW - prices[i]] + prices[i]) {
                    optimalCombo.push(prices[i]);
                    currW -= prices[i];
                }
            }

            const totalAmount = dp[n][W];
            const diff = totalAmount - voucherAmount; // 0以下になる（損する額、または手出し0で余る額）

            // UIへの結果反映
            document.getElementById('resTotal').innerText = `${totalAmount} 円`;
            
            if (diff === 0) {
                document.getElementById('resDiff').innerText = `ピッタリ！ (手出し 0 円)`;
                document.getElementById('resDiff').className = "font-bold text-lg text-green-600";
            } else {
                document.getElementById('resDiff').innerText = `${Math.abs(diff)} 円分の損`;
                document.getElementById('resDiff').className = "font-bold text-lg text-red-500";
            }

            const resList = document.getElementById('resList');
            resList.innerHTML = '';
            optimalCombo.reverse().forEach(price => {
                const li = document.createElement('li');
                li.innerText = `${price} 円の商品`;
                resList.appendChild(li);
            });

            // 結果を表示
            document.getElementById('resultView').classList.remove('hidden');
        }
    </script>
</body>
</html>
